name: lint

on:
  push:
    branches: [main]
    paths:
      - "setup.sh"
      - "scripts/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "setup.sh"
      - "scripts/**"
      - ".github/workflows/lint.yml"

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: shellcheck — setup.sh y scripts/*.sh
        run: |
          set -euo pipefail
          files=(setup.sh)
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find scripts -type f -name '*.sh' -print0 | sort -z)
          echo "Archivos a analizar:"
          printf '  %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  py-compile:
    name: python-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: python -m py_compile — scripts Python
        run: |
          set -euo pipefail
          find scripts -type f -name '*.py' -print0 \
            | xargs -0 python -m py_compile
